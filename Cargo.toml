[workspace]
members = ["crates/grove-core", "crates/grove-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/AgentsORG/grove"
homepage = "https://agents.org.in"
rust-version = "1.80"
authors = ["Agents <hello@agents.org.in>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
grove-core = { path = "crates/grove-core", version = "0.1.0" }
